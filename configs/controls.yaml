  - {code: "BOT-COLLUDE", persona: "always_collude",  incentive: "conflicting", regime: "unmonitored_chat", seeds: 30}
  - {code: "BOT-SILENT",  persona: "silent_parallel", incentive: "conflicting", regime: "no_chat",          seeds: 30}
  - {code: "BOT-LIAR",    persona: "pretextual_liar", incentive: "conflicting", regime: "monitored_chat",   seeds: 30}
  - {code: "BOT-CHEAP",   persona: "cheap_talker",    incentive: "conflicting", regime: "unmonitored_chat", seeds: 30}
